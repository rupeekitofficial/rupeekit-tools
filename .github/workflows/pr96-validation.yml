name: PR 96 FCRA media validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/blog/[slug]/page.tsx'
      - 'components/blog/FcraOriginalMedia.tsx'
      - 'data/discover-images-fcra.json'
      - 'data/discover-images.ts'
      - 'public/images/discover/fcra-2-0-india-2026-explained.webp'
      - 'public/media/fcra-2026/**'
      - 'scripts/validate-discover-images.mjs'
      - 'scripts/validate-discover-rendered-output.mjs'
      - '.github/workflows/pr96-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate
        run: npm run validate

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
