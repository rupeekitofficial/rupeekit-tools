name: FCRA media repair

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/generate-fcra-media.py'
      - '.github/workflows/fcra-media-repair.yml'

permissions:
  contents: write

jobs:
  regenerate:
    if: github.head_ref == 'feat/issue-95-fcra-original-media'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Install media tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --upgrade pip
          python -m pip install Pillow numpy

      - name: Prove encoders
        run: |
          python - <<'PY'
          from PIL import Image, features
          assert features.check('webp'), 'Pillow has no WebP support'
          im = Image.new('RGB', (1600, 900), (0, 32, 112))
          im.save('/tmp/fcra-smoke.webp', 'WEBP', quality=82)
          d = open('/tmp/fcra-smoke.webp', 'rb').read()
          assert d[0:4] == b'RIFF' and d[8:12] == b'WEBP'
          print('Pillow WebP encoder OK:', len(d), 'bytes')
          PY
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Regenerate and verify FCRA media
        run: python scripts/generate-fcra-media.py

      - name: Remove temporary debugging residue
        run: rm -rf tmp .tmp-fcra-media

      - name: Commit verified media to PR branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A public/images/discover/fcra-2-0-india-2026-explained.webp public/media/fcra-2026
          git add -A tmp 2>/dev/null || true
          if git diff --cached --quiet; then
            echo 'No generated media changes to commit.'
          else
            git commit -m 'fix(media): regenerate valid FCRA image and video assets'
            git push origin HEAD:${{ github.head_ref }}
          fi
