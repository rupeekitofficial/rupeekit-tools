name: Generate issue 40 Discover assets

on:
  push:
    branches: [codex/issue-40-discover-hero-images]

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-40-discover-hero-images
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pillow
      - name: Generate images and update metadata
        shell: bash
        run: |
          cat > /tmp/issue40.py <<'PY'
          import json
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont

          root = Path.cwd()
          out = root / 'public/images/discover'
          out.mkdir(parents=True, exist_ok=True)
          logo_path = root / 'public/brand/rupeekit_logo_horizontal_transparent.png'
          if not logo_path.exists():
              raise SystemExit(f'Missing brand asset: {logo_path}')
          logo = Image.open(logo_path).convert('RGBA')
          bold = '/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf'
          regular = '/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf'
          title_font = ImageFont.truetype(bold, 66)
          sub_font = ImageFont.truetype(regular, 30)
          symbol_font = ImageFont.truetype(bold, 104)

          rows = [
            ('rent-vs-buy-calculator-india','Rent vs Buy','Compare long-term housing costs',(25,112,88),'HOME'),
            ('home-affordability-calculator-india','Home Affordability','Income, EMI and down-payment check',(38,91,160),'₹'),
            ('job-offer-comparison-calculator-india','Job Offer Comparison','Compare two offers beyond headline CTC',(103,72,156),'A / B'),
            ('salary-increment-calculator-india','Salary Increment','See gross, take-home and real hike',(16,126,116),'↑'),
            ('bonus-tax-calculator-india','Bonus Tax','Estimate the post-tax bonus value',(184,96,32),'₹'),
            ('fire-retirement-calculator-india','FIRE Retirement','Estimate a financial-independence corpus',(82,68,153),'FIRE'),
            ('net-worth-tracker-calculator-india','Net Worth Tracker','Balance assets against liabilities',(16,112,85),'±'),
            ('education-loan-emi-tax-benefit-calculator-india','Education Loan EMI','Plan repayment and an 80E illustration',(55,78,165),'EDU'),
            ('rental-yield-calculator-india','Rental Yield','Compare gross and net property yield',(175,103,26),'%'),
            ('debt-snowball-calculator-india','Debt Snowball','Plan a practical debt payoff order',(145,50,69),'1→3'),
          ]

          manifest_entries = []
          alts = {
            'rent-vs-buy-calculator-india':'Indian household comparing renting and buying costs with a home, calculator and RupeeKit planning card',
            'home-affordability-calculator-india':'Indian home affordability planning scene with income, EMI, down payment and a RupeeKit calculator card',
            'job-offer-comparison-calculator-india':'Indian professional comparing two job offer folders, expected value and work costs with RupeeKit',
            'salary-increment-calculator-india':'Indian salary increment planning visual showing revised pay, monthly difference and inflation impact',
            'bonus-tax-calculator-india':'Indian employee estimating bonus deductions and net bonus using a RupeeKit educational planning visual',
            'fire-retirement-calculator-india':'Indian financial independence planning scene with a retirement target path and RupeeKit corpus estimate',
            'net-worth-tracker-calculator-india':'Indian personal net worth planning visual balancing assets, loans and liabilities with RupeeKit',
            'education-loan-emi-tax-benefit-calculator-india':'Indian education loan planning scene with graduation, EMI schedule and an illustrative tax benefit estimate',
            'rental-yield-calculator-india':'Indian property owner comparing rent, vacancy, costs and net rental yield with RupeeKit',
            'debt-snowball-calculator-india':'Indian borrower arranging three debts into a practical snowball payoff order with RupeeKit',
          }

          for index,(slug,title,subtitle,accent,symbol) in enumerate(rows):
              img = Image.new('RGBA',(1600,900),(247,249,252,255))
              d = ImageDraw.Draw(img)
              soft = tuple(int(v + (255-v)*0.84) for v in accent)
              d.ellipse((980,-260,1740,500),fill=(*soft,255))
              d.ellipse((-260,620,380,1230),fill=(*soft,255))
              d.rounded_rectangle((70,55,440,155),radius=24,fill=(255,255,255,242),outline=(218,223,230,255),width=3)
              ratio=min(315/logo.width,70/logo.height)
              mark=logo.resize((max(1,int(logo.width*ratio)),max(1,int(logo.height*ratio))),Image.Resampling.LANCZOS)
              img.alpha_composite(mark,(92,70))
              d.text((85,245),title,font=title_font,fill=(24,36,52,255))
              d.text((90,345),subtitle,font=sub_font,fill=(77,88,105,255))
              d.rounded_rectangle((88,430,530,495),radius=22,fill=(*accent,255))
              d.text((120,447),'INDIA MONEY DECISION',font=ImageFont.truetype(bold,24),fill=(255,255,255,255))
              # Unique right-side editorial card.
              d.rounded_rectangle((900,170,1450,730),radius=55,fill=(255,255,255,255),outline=(*accent,255),width=8)
              d.ellipse((1030,260,1320,550),fill=(*soft,255),outline=(*accent,255),width=7)
              box=d.textbbox((0,0),symbol,font=symbol_font)
              d.text((1175-(box[2]-box[0])/2,405-(box[3]-box[1])/2),symbol,font=symbol_font,fill=(*accent,255))
              for j,w in enumerate((390,300,220)):
                  d.rounded_rectangle((980,590+j*48,980+w,618+j*48),radius=12,fill=(*accent,255) if j==0 else (220,225,232,255))
              path=out/f'{slug}.webp'
              img.convert('RGB').save(path,'WEBP',quality=78,method=6)
              if path.stat().st_size > 350_000:
                  img.convert('RGB').save(path,'WEBP',quality=65,method=6)
              if path.stat().st_size > 350_000:
                  raise SystemExit(f'Image too large: {path}')
              header=path.read_bytes()[:12]
              if header[:4] != b'RIFF' or header[8:12] != b'WEBP':
                  raise SystemExit(f'Invalid WebP: {path}')
              manifest_entries.append({'path':f'/tools/{slug}','src':f'/images/discover/{slug}.webp','alt':alts[slug],'width':1600,'height':900})
              print(path, path.stat().st_size)

          manifest_path=root/'data/discover-images.json'
          manifest=json.loads(manifest_path.read_text())
          new_paths={x['path'] for x in manifest_entries}
          manifest=[x for x in manifest if x.get('path') not in new_paths]
          manifest.extend(manifest_entries)
          manifest_path.write_text(json.dumps(manifest,indent=2,ensure_ascii=False)+'\n')

          validator=root/'scripts/validate-discover-images.mjs'
          text=validator.read_text()
          old="const growthTools = JSON.parse(fs.readFileSync(path.join(root, 'data', 'growth-tools.json'), 'utf8'));\nconst tools = [...baseTools, ...growthTools];"
          new="const growthTools = JSON.parse(fs.readFileSync(path.join(root, 'data', 'growth-tools.json'), 'utf8'));\nconst decisionTools = JSON.parse(fs.readFileSync(path.join(root, 'data', 'decision-tools-2026.json'), 'utf8'));\nconst tools = [...baseTools, ...growthTools, ...decisionTools];"
          if old not in text:
              raise SystemExit('Validator tool-list pattern not found')
          text=text.replace(old,new).replace('manifest.length !== 61','manifest.length !== 71').replace('Expected 61 Discover images','Expected 71 Discover images')
          validator.write_text(text)

          docs=root/'docs/discover-image-research-2026-07-17.md'
          text=docs.read_text()
          old_decision='RupeeKit will use original, human-led editorial hero photography that shows a recognisable Indian money decision. Calculator screenshots, generic logos, currency piles, text-heavy thumbnails, fabricated official documents, and exaggerated wealth or distress are excluded.'
          new_decision='RupeeKit will use original, human-led editorial hero visuals that show a recognisable Indian money decision. Calculator screenshots, third-party logos, currency piles, text-heavy thumbnails, fabricated official documents, and exaggerated wealth or distress are excluded. A small, legible RupeeKit brand mark is permitted when it is unobscured and secondary to the editorial scene.'
          old_check='- Generated as an original editorial asset and reviewed for logos, private data, misleading claims and obvious visual defects.'
          new_check='- Generated as an original editorial asset and reviewed for third-party logos or official emblems, private data, misleading claims and obvious visual defects. A legible RupeeKit brand mark is permitted.'
          if old_decision not in text or old_check not in text:
              raise SystemExit('Discover-image policy pattern not found')
          docs.write_text(text.replace(old_decision,new_decision).replace(old_check,new_check))
          PY
          python /tmp/issue40.py
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npm run lint
      - run: npm run build
      - name: Commit validated assets
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/issue-40-generate-images.yml
          git add data/discover-images.json docs/discover-image-research-2026-07-17.md scripts/validate-discover-images.mjs public/images/discover/*.webp
          git commit -m 'feat: add branded Discover images for decision calculators'
          git push origin HEAD:codex/issue-40-discover-hero-images
