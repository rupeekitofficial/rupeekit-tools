      - name: Install dependencies
        run: npm ci

      - name: Validate
        run: npm run validate

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Commit validated package and remove temporary workflow
        run: |
          rm .github/workflows/build-income-tax-helpdesk-update.yml
          git config user.name 'RupeeKit Update Bot'
          git config user.email 'rupeekitofficial@gmail.com'
          git add data/financial-updates.ts app/financial-updates/[slug]/page.tsx public/images/updates/income-tax-helpdesk-24x7 .github/workflows/build-income-tax-helpdesk-update.yml
          git commit -m 'Add 24x7 Income Tax helpdesk story update'
          git push origin HEAD:content/income-tax-helpdesk-24x7-july-2026
